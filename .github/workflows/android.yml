name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, crypto, storage and Robolectric UI tests
        run: ./gradlew test --console=plain
      - name: Lint
        run: ./gradlew lintDebug --console=plain
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest --console=plain
      - name: Cross check the format with the independent Python decoder
        run: |
          pip install cryptography
          python3 -c "import sys; sys.path.insert(0,'tools'); from vxc_decrypt import decrypt; m,a=decrypt(open('app/src/test/resources/vectors/v1_password_segment4096.vxc','rb').read(), b'VOXCRYPT-test-vector-v1'); assert m['name']=='vector.m4a' and len(a)==10000; print(m)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxcrypt-build
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/screenshots/
            app/build/reports/
